<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" role="img" aria-label="Tandem Stick: one stick per machine, control them all by radio">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#03050c"/><stop offset="1" stop-color="#0d1b3a"/></linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6aa8ff"/><stop offset="1" stop-color="#2f5de0"/></linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5df2d0"/><stop offset="1" stop-color="#1fa8c9"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#2b5cff" stroke-opacity=".18"/></pattern>
    <style>
      .p { fill: none; stroke: #7fe3ff; stroke-width: 3; stroke-linecap: round; transform-box: fill-box; transform-origin: center; animation: ping 3s ease-out infinite; }
      .p:nth-child(2) { animation-delay: 1s } .p:nth-child(3) { animation-delay: 2s }
      @keyframes ping { 0% { opacity: .9; transform: scale(.3) } 100% { opacity: 0; transform: scale(1.4) } }
      .led { animation: blink 2s ease-in-out infinite } @keyframes blink { 50% { opacity: .3 } }
    </style>
  </defs>
  <rect width="1280" height="400" fill="url(#sky)"/>
  <g opacity=".9"><circle cx="120" cy="60" r="1.6" fill="#fff"/><circle cx="340" cy="30" r="1.2" fill="#fff"/><circle cx="560" cy="80" r="1.4" fill="#fff"/><circle cx="900" cy="40" r="1.6" fill="#fff"/><circle cx="1150" cy="90" r="1.2" fill="#fff"/><circle cx="1220" cy="30" r="1.4" fill="#fff"/></g>
  <rect y="250" width="1280" height="150" fill="url(#grid)"/>
  <g transform="translate(210 108)">
    <circle class="p" cx="170" cy="60" r="44"/><circle class="p" cx="170" cy="60" r="44"/><circle class="p" cx="170" cy="60" r="44"/>
    <rect x="10" y="40" width="30" height="36" rx="6" fill="#c9d6f2"/><rect x="34" y="20" width="120" height="76" rx="18" fill="url(#a)"/><circle class="led" cx="62" cy="58" r="7" fill="#fff"/>
  </g>
  <g transform="translate(790 108)">
    <rect x="30" y="20" width="120" height="76" rx="18" fill="url(#b)"/><rect x="144" y="40" width="30" height="36" rx="6" fill="#c9d6f2"/><circle class="led" cx="118" cy="58" r="7" fill="#fff"/>
  </g>
  <path d="M370 150Q640 40 910 150" fill="none" stroke="#7fe3ff" stroke-width="2.5" stroke-dasharray="6 8" opacity=".7"><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.2s" repeatCount="indefinite"/></path>
  <text x="640" y="262" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="74" font-weight="700" fill="#fff" letter-spacing="-2">Tandem Stick</text>
  <text x="640" y="306" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#8fb4ff">One stick per machine. Control them all by radio.</text>
  <text x="640" y="350" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#6b7a99" letter-spacing="3">OPEN HARDWARE CONCEPT · 3D WORLD · PLAN · TEST LAB · FAB FILES</text>
</svg>
